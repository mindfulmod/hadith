<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Same-content comparison · Hadith</title><style>body{font:14px/1.5 system-ui;background:#f6f0e7;color:#392e32;margin:20px}nav{display:flex;gap:15px;align-items:center;flex-wrap:wrap;margin-bottom:20px}a{color:inherit}button,select{font:inherit;padding:10px;border:1px solid #ad918c;background:#fffaf3;border-radius:6px}#frames{display:flex;gap:24px;width:max-content}figure{margin:0}figcaption{margin:0 0 12px;font-size:14px}iframe{width:393px;height:852px;border:1px solid #d7c7c5;border-radius:12px;background:#fffaf3}p{max-width:900px;font-size:12px}</style></head><body><nav><a href="index.html">← Design study</a><label>Viewport <select id="width"><option>393</option><option>320</option><option>768</option><option>1024</option></select></label><label>Theme <select id="theme"><option value="day">Day</option><option value="night">Night</option></select></label><button id="reset">Reset comparison</button></nav><p>Each frame has the same CSS viewport width, Hadith 1 and a collapsed chain. Browser chrome is excluded. Baseline uses the existing reader; its saved preferences may differ if you have used that origin. Concepts include a 42px experiment bar that would not ship.</p><div id="frames"><figure><figcaption>Existing reader</figcaption><iframe title="Existing reader" id="baseline" src="../../reader/#read/1"></iframe></figure><figure><figcaption>A · Open reading</figcaption><iframe title="A · Open reading" id="open" src="concept.html?concept=open&size=21#read/1"></iframe></figure><figure><figcaption>B · A small session — reading</figcaption><iframe title="B · A small session" id="session" src="concept.html?concept=session&size=21#read/1"></iframe></figure><figure><figcaption>C · Listening companion — reading</figcaption><iframe title="C · Listening companion" id="companion" src="concept.html?concept=companion&size=21#read/1"></iframe></figure></div><script>function update(){for(const frame of document.querySelectorAll('iframe'))frame.style.width=document.querySelector('#width').value+'px';for(const c of ['open','session','companion'])document.getElementById(c).src='concept.html?concept='+c+'&theme='+document.querySelector('#theme').value+'&size=21#read/1';}document.querySelector('#width').onchange=update;document.querySelector('#theme').onchange=update;document.querySelector('#reset').onclick=()=>location.reload();</script></body></html>
