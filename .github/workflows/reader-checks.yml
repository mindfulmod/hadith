name: Reader checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Verify source and staged catalogue
        run: |
          node reader/check-content.mjs
          node scripts/import-bukhari.mjs --check > /dev/null
      - name: Test reader, backups, search and release hashes
        run: node --test tests/*.test.mjs
      - name: Check patch formatting
        run: git diff --check
